<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>CROWNHEAD AFTER HOURS</title>
<meta name="description" content="The last light is mine.">
<link rel="stylesheet" href="night.css?v=crownhead">
</head>
<body><main class="shell">
<div class="topline"><span>CROWNHEAD / AFTER HOURS</span><b>■ 夜班营业</b></div><header class="hero"><img class="scene" src="bar.svg" alt="" fetchpriority="high"><div class="intro"><div class="eyebrow">深夜吧台 / 一个约定的座位</div><h1 class="wordmark" lang="en"><span>CROWNHEAD</span> <span>AFTER HOURS</span></h1><p class="tagline" lang="en">The last light is mine.</p></div><div class="sign" aria-hidden="true">SEAT 01</div></header>
<div class="grid">
<aside class="panel" aria-labelledby="archive-cap"><h2 class="panel-cap" id="archive-cap">手记柜 <span>01 / LOG</span></h2><div class="inside"><button id="new" class="primary">＋ 写一篇</button><input id="search" class="search" type="search" placeholder="搜标题或正文" aria-label="搜标题或正文"><div class="row tabs" role="group" aria-label="手记分类"><button data-filter="all" aria-pressed="true">全部</button><button data-filter="draft" aria-pressed="false">随手写</button><button data-filter="kept" aria-pressed="false">慢慢整理</button></div><p id="none" class="muted" hidden></p><ul id="list" class="list"></ul></div></aside>
<section class="panel writing" aria-labelledby="counter-cap"><h2 class="panel-cap" id="counter-cap">吧台 <span>02 / COUNTER</span></h2><div class="inside"><div id="editor"><div class="row top"><small id="kind">随手写</small><small id="count">0 字符</small></div><input class="title" id="title" aria-label="标题" placeholder="标题可以晚点取" maxlength="180" autocomplete="off"><textarea class="body" id="body" aria-label="正文" placeholder="从这一刻想写的那一句开始。"></textarea><div class="row foot"><button id="move">移到慢慢整理</button><div class="row"><button id="markdown">下载此篇</button><button id="remove">移到废纸篓</button></div></div></div><div id="blank" class="empty" hidden><i class="pixel" aria-hidden="true"></i><strong>今晚的座位还空着。</strong><p>想写的时候，再点「写一篇」。</p></div><p id="status" role="status"></p></div></section>
</div>
<details class="utility"><summary>本机存储、备份与废纸篓</summary><p class="muted">手记只保存在当前浏览器，不上传、不跨设备同步，也未加密。清除浏览数据可能丢失，请定期下载备份。备份包含废纸篓和原文，请妥善存放。</p><div class="row"><button id="export">下载全部备份</button><button id="import">导入备份</button><input id="file" type="file" accept=".json,application/json" hidden><button id="trash" aria-pressed="false">看废纸篓</button></div></details>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id), key='liubai.journal.v1', groups=['draft','kept','trash'];
let notes=[], active=null, filter='all', storageIssue='';
function valid(data){return data && data.version===1 && Array.isArray(data.notes) && data.notes.every(n=>n&&typeof n.id==='string'&&n.id&&typeof n.title==='string'&&typeof n.body==='string'&&groups.includes(n.group)&&Number.isFinite(n.time)&&['draft','kept',undefined].includes(n.prior)) && new Set(data.notes.map(n=>n.id)).size===data.notes.length;}
try{const raw=localStorage.getItem(key);if(raw){const data=JSON.parse(raw);if(!valid(data))throw Error('bad data');notes=data.notes;}}catch{storageIssue='无法读取旧手记；为免覆盖旧数据，本次只在内存里写。离开前请下载备份。';}
function status(s){$('status').textContent=storageIssue||s;}
function save(){if(storageIssue){status('');return;}try{localStorage.setItem(key,JSON.stringify({version:1,notes}));status('已保存在当前浏览器');}catch{status('未能写入浏览器存储，离开前请下载备份。');}}
const current=()=>notes.find(n=>n.id===active);
const name=n=>n.title.trim()||'未命名手记';
const groupName=g=>({draft:'随手写',kept:'慢慢整理',trash:'废纸篓'})[g];
const sorted=()=>[...notes].sort((a,b)=>b.time-a.time);
function list(){
 const q=$('search').value.trim().toLowerCase(), rows=sorted().filter(n=>(filter==='all'?n.group!=='trash':n.group===filter)&&(!q||(n.title+'\n'+n.body).toLowerCase().includes(q)));
 $('list').replaceChildren();$('none').hidden=!!rows.length;$('none').textContent=q?'没有找到这段文字。':'这里还没有手记。';
 for(const n of rows){const li=document.createElement('li'), b=document.createElement('button'), label=document.createElement('small');b.type='button';b.setAttribute('aria-pressed',String(n.id===active));b.textContent=name(n);label.textContent=groupName(n.group);b.append(label);b.onclick=()=>open(n.id);li.append(b);$('list').append(li);}
}
function count(){ $('count').textContent=[...$('body').value.replace(/\s/g,'')].length+' 字符'; }
function open(id){
 active=id;const n=current();$('editor').hidden=!n;$('blank').hidden=!!n;
 if(n){$('title').value=n.title;$('body').value=n.body;$('kind').textContent=groupName(n.group);$('title').readOnly=$('body').readOnly=n.group==='trash';$('move').textContent=n.group==='trash'?'恢复此篇':n.group==='draft'?'移到慢慢整理':'移回随手写';$('remove').hidden=n.group==='trash';count();}list();
}
function view(g){filter=g;document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===g)));$('trash').setAttribute('aria-pressed',String(g==='trash'));const n=sorted().find(n=>g==='all'?n.group!=='trash':n.group===g);open(n?.id??null);}
function fresh(){const n={id:globalThis.crypto?.randomUUID?.()??Date.now()+'-'+Math.random().toString(36).slice(2),title:'',body:'',group:'draft',time:Date.now()};notes.unshift(n);$('search').value='';view('all');open(n.id);save();$('body').focus();}
for(const f of ['title','body'])$(f).addEventListener('input',()=>{const n=current();if(!n||n.group==='trash')return;n[f]=$(f).value;n.time=Date.now();save();count();list();});
$('new').onclick=fresh;$('search').oninput=list;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>view(b.dataset.filter));
$('trash').onclick=()=>view(filter==='trash'?'all':'trash');
$('move').onclick=()=>{const n=current();if(!n)return;n.group=n.group==='trash'?(n.prior||'draft'):n.group==='draft'?'kept':'draft';delete n.prior;save();if(filter!=='all')view(n.group);open(n.id);};
$('remove').onclick=()=>{const n=current();if(!n)return;n.prior=n.group;n.group='trash';save();view(filter);};
function download(text, type, filename){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('markdown').onclick=()=>{const n=current();if(n)download('# '+name(n)+'\n\n'+n.body,'text/markdown;charset=utf-8','CROWNHEAD-手记.md');};
$('export').onclick=()=>download(JSON.stringify({version:1,notes},null,2),'application/json;charset=utf-8','留白-备份-'+new Date().toISOString().slice(0,10)+'.json');
$('import').onclick=()=>$('file').click();
$('file').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{const data=JSON.parse(await file.text());if(!valid(data))throw Error('invalid');const ids=new Set(notes.map(n=>n.id));const additions=data.notes.filter(n=>!ids.has(n.id));const duplicates=data.notes.length-additions.length;if(!additions.length){status('没有新增手记；已有手记保持不变。');return;}notes.push(...additions);save();if(!storageIssue&&$('status').textContent==='已保存在当前浏览器')status('已导入 '+additions.length+' 篇'+(duplicates?'；跳过已有 '+duplicates+' 篇':'')+'。');view('all');}catch{status('未导入：这个文件不是有效的留白备份。');}};
view('all');status('手记不会上传，只留在当前浏览器。');
</script></body></html>
